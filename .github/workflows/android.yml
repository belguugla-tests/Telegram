name: Fast Telegram Standalone Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    runs-all-jobs-on: ubuntu-latest

    steps:
    - name: Checkout Code with Shallow History
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Setup Java Development Kit 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Performance Cache
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}

    - name: Pre-Accept Android SDK and NDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n2e65d32741d459b560845a78c1157d67484d29a5" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84332958134aab958134aab958134aab958134aa" > $ANDROID_HOME/licenses/android-sdk-preview-license

    - name: Execute High-Speed Parallel Compilation
      run: |
        chmod +x gradlew
        ./gradlew assembleStandalone \
          --parallel \
          --configure-on-demand \
          --max-workers=4 \
          -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC" \
          -Pandroid.builders.threads=2 \
          -x test \
          -x lint \
          -x lintVitalStandalone

    - name: Upload Compiled Standalone APK Output
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Standalone-APK
        path: |
          **/build/outputs/apk/**/*.apk
