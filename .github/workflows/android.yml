name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleStandalone --daemon --parallel --configure-on-demand --max-workers=4 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC" -Pandroid.builders.threads=4 -x test -x lint -x lintVitalStandalone

